<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python百问</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e8e8e8;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    .header { text-align: center; margin-bottom: 50px; }
    .logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100px; height: 100px;
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      border-radius: 24px; margin-bottom: 24px;
      box-shadow: 0 10px 40px rgba(253, 160, 133, 0.3);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .logo i { font-size: 48px; color: #1a1a2e; }
    h1 {
      font-size: 48px; font-weight: 700;
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 12px;
    }
    .subtitle { font-size: 18px; color: #94a3b8; margin-bottom: 30px; }
    .stats { display: flex; justify-content: center; gap: 40px; }
    .stat-item { text-align: center; }
    .stat-value { font-size: 32px; font-weight: 700; color: #fda085; }
    .stat-label { font-size: 14px; color: #64748b; }
    .search-box { margin-bottom: 40px; }
    .search-wrapper { position: relative; }
    .search-wrapper i {
      position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
      color: #64748b; font-size: 18px;
    }
    .search-input {
      width: 100%; padding: 16px 24px 16px 56px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px; color: #e8e8e8; outline: none;
      transition: all 0.3s ease;
    }
    .search-input:focus { border-color: #fda085; background: rgba(255, 255, 255, 0.12); }
    .search-input::placeholder { color: #64748b; }
    .section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px; margin-bottom: 24px; overflow: hidden;
      transition: all 0.3s ease;
    }
    .section:hover { border-color: rgba(253, 160, 133, 0.3); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
    .section-header {
      padding: 20px 28px;
      background: linear-gradient(135deg, rgba(253, 160, 133, 0.15) 0%, rgba(246, 211, 101, 0.1) 100%);
      display: flex; align-items: center; gap: 16px; cursor: pointer; user-select: none;
    }
    .section-header:hover { background: linear-gradient(135deg, rgba(253, 160, 133, 0.2) 0%, rgba(246, 211, 101, 0.15) 100%); }
    .section-icon {
      width: 44px; height: 44px; flex-shrink: 0;
      background: linear-gradient(135deg, #fda085 0%, #f6d365 100%);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #1a1a2e;
    }
    .section-title { flex: 1; }
    .section-title h2 { font-size: 18px; font-weight: 600; color: #f0f0f0; margin-bottom: 4px; }
    .section-count { font-size: 13px; color: #94a3b8; }
    .section-arrow { font-size: 18px; color: #64748b; transition: transform 0.3s ease; }
    .section.expanded .section-arrow { transform: rotate(180deg); }
    .section-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
    .section.expanded .section-content { max-height: 3000px; }
    .question-list { padding: 8px 0; }
    .question-item {
      display: flex; align-items: flex-start;
      padding: 14px 28px; border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: background 0.2s ease;
    }
    .question-item:last-child { border-bottom: none; }
    .question-item:hover { background: rgba(253, 160, 133, 0.08); }
    .question-link {
      flex: 1; font-size: 15px; line-height: 1.7;
      color: #c8c8c8; text-decoration: none;
      transition: all 0.2s ease; cursor: pointer;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .question-link:hover { color: #fda085; }
    .question-link .robot-icon {
      margin-top: 4px; color: #fda085; opacity: 0; transform: translateX(-10px);
      transition: all 0.2s ease; font-size: 14px;
    }
    .question-link:hover .robot-icon { opacity: 1; transform: translateX(0); }
    .question-number { color: #64748b; font-size: 13px; min-width: 28px; }
    .no-results { text-align: center; padding: 60px 20px; color: #64748b; }
    .no-results i { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
    .back-to-top {
      position: fixed; bottom: 30px; right: 30px;
      width: 50px; height: 50px;
      background: linear-gradient(135deg, #fda085 0%, #f6d365 100%);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; visibility: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(253, 160, 133, 0.4);
      border: none; color: #1a1a2e; font-size: 20px;
    }
    .back-to-top.visible { opacity: 1; visibility: visible; }
    .back-to-top:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(253, 160, 133, 0.5); }
    .footer { text-align: center; padding: 40px 20px; color: #64748b; font-size: 14px; }
    .highlight { color: #fda085; font-weight: 500; }
    @media (max-width: 768px) {
      h1 { font-size: 36px; }
      .stats { gap: 24px; }
      .section-header { padding: 16px 20px; }
      .question-item { padding: 12px 20px; }
      .question-link { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><i class="fab fa-python"></i></div>
      <h1>Python百问</h1>
      <p class="subtitle">学习Python过程中常见的100+核心问题</p>
      <div class="stats">
        <div class="stat-item">
          <div class="stat-value" id="sectionCount">14</div>
          <div class="stat-label">知识模块</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="questionCount">100+</div>
          <div class="stat-label">核心问题</div>
        </div>
      </div>
    </div>
    <div class="search-box">
      <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索问题...">
      </div>
    </div>
    <div id="questionSections"></div>
  </div>
  <button class="back-to-top" id="backToTop"><i class="fas fa-arrow-up"></i></button>
  <div class="footer"><p>点击任意问题，开启<span class="highlight">AI智能答疑</span></p></div>

  <script>
    var sections = [
      {
        title: "第一层：Python初印象与环境操作",
        icon: "fa-rocket",
        questions: [
          "Python 是一种什么类型的语言？（编译型还是解释型？）",
          "我们使用什么工具来编写和运行 Python 程序？（IDLE 是什么？）",
          "交互式环境（>>>）和脚本式（.py 文件）运行方式有什么不同？",
          "如何新建一个 .py 文件并运行它？（F5 快捷键的作用？）",
          "注释有什么作用？单行注释和多行注释分别怎么写？",
          "print() 命令的作用是什么？它输出时，带引号和不带引号有什么区别？",
          "input() 命令的作用是什么？它输入的数据默认是什么数据类型？"
        ]
      },
      {
        title: "第二层：数据、常量、变量与数据类型",
        icon: "fa-database",
        questions: [
          "什么是常量？请举例说明。",
          "什么是变量？变量名可以随意起吗？",
          "变量命名必须遵守哪些规则？（哪些字符不能用？能不能以数字开头？）",
          "Python 中的关键字（如 if、for、while）可以当作变量名吗？",
          "学测中要求掌握哪几种基本数据类型？",
          "整型（int） 是什么？举例。",
          "浮点型（float） 是什么？举例。",
          "字符串（str） 有什么特征？（必须用引号括起来？）",
          "布尔型（bool） 只有哪两个值？首字母大小写有要求吗？",
          "如何查看一个变量或数据属于什么类型？（type() 函数的作用？）",
          "赋值号 = 和数学中的等号意义相同吗？a = a + 1 在程序中是什么意思？"
        ]
      },
      {
        title: "第三层：运算符、表达式与类型转换",
        icon: "fa-calculator",
        questions: [
          "Python 中的基本算术运算符有哪些？",
          "+、-、*、/ 分别是什么？（/ 的结果一定是浮点数吗？）",
          "// 是什么运算？（整除，取商的整数部分）",
          "% 是什么运算？（取余数）",
          "** 是什么运算？（幂运算）",
          "字符串能用 + 和 * 运算吗？分别是什么效果？（拼接和重复）",
          "不同类型的数字（整型和浮点型）混合运算时，结果是什么类型？",
          "运算符的优先级是怎样的？（先乘除后加减，括号最优先？）",
          "什么是表达式？3 + 5 * 2 是表达式吗？它会返回一个值吗？",
          "如何将字符串 123 转换为整数？（int() 函数）",
          "如何将整数转换为浮点数？（float() 函数）",
          "如何将数字转换为字符串？（str() 函数）",
          "关系运算符有哪些？",
          "==（等于）和 =（赋值）能混用吗？",
          "!=（不等于）、>、<、>=、<=",
          "逻辑运算符有哪些？",
          "and（与）、or（或）、not（非）分别表示什么逻辑？"
        ]
      },
      {
        title: "第四层：常用内置函数",
        icon: "fa-square-root-variable",
        questions: [
          "print() 函数如何输出多个内容？（用逗号分隔）",
          "input() 函数的括号里可以写提示文字吗？怎么写？",
          "type() 函数的作用是什么？",
          "int()、float()、str() 三个转换函数各自怎么用？",
          "round() 函数的作用是什么？（四舍五入）比如 round(3.14159, 2) 结果是多少？",
          "abs() 函数的作用是什么？（求绝对值）",
          "max()、min()、sum() 分别有什么作用？它们能作用于列表吗？",
          "len() 函数的作用是什么？（求字符串或列表的长度）"
        ]
      },
      {
        title: "第五层：顺序结构",
        icon: "fa-list-ol",
        questions: [
          "程序默认的执行流程是什么？（从上到下依次执行——这就是顺序结构？）",
          "在顺序结构中，input() 和 print() 的先后顺序会影响程序结果吗？"
        ]
      },
      {
        title: "第六层：选择结构（分支）",
        icon: "fa-code-branch",
        questions: [
          "什么是选择结构？它解决什么问题？（根据条件决定是否执行某段代码）",
          "if 语句的基本格式是什么？（冒号和缩进是必须的吗？缩进通常用几个空格？）",
          "if-else 语句和 if-elif-else 语句有什么区别？",
          "elif 是 else if 的缩写吗？它可以多次使用吗？",
          "条件判断中，关系表达式的结果是什么类型？（布尔型 True 或 False）",
          "如何用 and 表示并且的关系？如何用 or 表示或者的关系？",
          "如何用 not 对条件取反？",
          "什么是嵌套 if？就是在一个 if 里面再写一个 if 吗？",
          "如何判断一个整数是奇数还是偶数？（用 % 2 == 0 吗？）",
          "如何判断一个年份是否为闰年？（条件是什么？）"
        ]
      },
      {
        title: "第七层：循环结构（一）—— for 循环",
        icon: "fa-sync",
        questions: [
          "什么是循环结构？它解决什么问题？（让代码重复执行）",
          "for 循环通常用于什么场景？（遍历已知范围或序列）",
          "range() 函数有哪几种用法？",
          "range(5) 产生哪些数字？",
          "range(2, 5) 产生哪些数字？",
          "range(1, 10, 2) 产生哪些数字？（步长是什么？）",
          "for 循环如何遍历一个字符串中的每个字符？",
          "for 循环如何遍历一个列表中的每个元素？",
          "循环体中变量的值会随每次循环而变化吗？"
        ]
      },
      {
        title: "第八层：循环结构（二）—— while 循环与流程控制",
        icon: "fa-infinity",
        questions: [
          "while 循环通常用于什么场景？（当不确定循环次数，只知道条件时）",
          "while 循环的格式是什么？它的循环条件是一个布尔表达式吗？",
          "for 循环和 while 循环在什么情况下可以互相替换？",
          "什么是无限循环？while True: 是无限循环吗？如何跳出？",
          "break 语句的作用是什么？（立即终止整个循环）",
          "continue 语句的作用是什么？（跳过本次循环剩余语句，进入下一轮）",
          "循环嵌套是什么？（一个循环里面再套一个循环）",
          "用循环实现累加（如求 1+2+...+100）的思路是什么？",
          "用循环实现累乘（如求 1×2×3×...×10）的思路是什么？",
          "用循环实现计数（如统计 1~100 中偶数的个数）的思路是什么？"
        ]
      },
      {
        title: "第九层：字符串（核心操作）",
        icon: "fa-quote-right",
        questions: [
          "字符串可以用哪些方式表示？（单引号、双引号、三引号？）",
          "什么是字符串索引？索引从 0 开始还是从 1 开始？",
          "对于 s = hello，s[0] 是什么？s[4] 是什么？",
          "什么是负索引？s[-1] 代表什么？（最后一个字符）",
          "什么是字符串切片？s[1:4] 取到哪些字符？（注意左闭右开原则）",
          "s[:3] 和 s[3:] 分别是什么意思？（省略开始或结束）",
          "如何获取字符串的长度？（用 len(s)）",
          "字符串的常用方法有哪些？",
          ".upper() 和 .lower() 分别做什么？",
          ".strip() 做什么？（去除首尾空白字符）",
          ".split() 做什么？（将字符串按指定字符分割成列表）",

      },
      {

          "如何获取列表的长度？（用 len()）",
          "列表的常用方法有哪些？",
          ".append() 做什么？（在末尾添加一个元素）",
          ".insert() 做什么？（在指定位置插入元素）",
          ".remove() 做什么？（删除第一个匹配的指定值）",

        questions: [

          "函数的参数是什么？调用时传入的数据叫参数吗？",
          "函数的返回值是什么？用什么关键字返回？（return）",
          "如果一个函数没有写 return，它返回什么？（None）",
          "什么是局部变量？在函数内部定义的变量，能在函数外部使用吗？",

          "import math 后如何使用 math.sqrt()？",
          "from math import sqrt 后如何使用 sqrt()？",
          "学测常考的 math 模块中有哪些函数和常量？",
          "math.sqrt() 求平方根",
          "math.ceil() 向上取整",
          "math.floor() 向下取整",
          "math.pi 圆周率",
          "学测常考的 random 模块中有哪些函数？",

          "把赋值号 = 误写成比较号 == 会有什么后果？（常见于 if 条件中）",
          "input() 返回的是字符串，如果要用它进行数学比较，应该先做什么？（用 int() 转换）",
          "字符串和数字用 + 拼接时会报错吗？怎么解决？（用 str() 转换数字）",
          "for i in range(n): 循环结束后，变量 i 的值是多少？（是 n-1）",
          "在遍历列表时，如果同时删除列表元素，可能会有什么问题？（建议用 while 或遍历副本）",
          "print() 默认输出后会换行，如何让它不换行？（设置 end= 参数）",
          "在循环中使用 break 和 continue 时，要注意什么？（break 彻底结束，continue 只跳过本次）",
          "学测的编程大题通常是什么模式？（输入 → 处理（计算/判断/循环）→ 输出）"
        ]
      }
    ];

    var globalQuestionIndex = 1;

    function renderSections(filter) {
      if (!filter) filter = '';
      var container = document.getElementById('questionSections');
      container.innerHTML = '';
      globalQuestionIndex = 1;
      var totalQuestions = 0;
      var totalSections = 0;

      for (var i = 0; i < sections.length; i++) {
        var section = sections[i];
        var filtered = [];
        for (var j = 0; j < section.questions.length; j++) {
          if (section.questions[j].toLowerCase().indexOf(filter.toLowerCase()) !== -1) {
            filtered.push(section.questions[j]);
          }
        }

        if (filtered.length === 0 && filter) continue;

        totalQuestions += filtered.length;
        totalSections++;

        var sectionEl = document.createElement('div');
        sectionEl.className = 'section expanded';

        var headerHtml = '<div class="section-header" onclick="toggleSection(this)">'
          + '<div class="section-icon"><i class="fas ' + section.icon + '"></i></div>'
          + '<div class="section-title">'
          + '<h2>' + section.title + '</h2>'
          + '<span class="section-count">' + section.questions.length + ' 个问题</span>'
          + '</div>'
          + '<i class="fas fa-chevron-down section-arrow"></i>'
          + '</div>';

        var listHtml = '<div class="section-content"><div class="question-list">';
        for (var k = 0; k < filtered.length; k++) {
          var q = filtered[k];
          var qnum = globalQuestionIndex++;
          listHtml += '<div class="question-item">'
            + '<div class="question-link" onclick="openAiQa(\'' + q.replace(/'/g, "\\'") + '\')">'
            + '<i class="fas fa-robot robot-icon"></i>'
            + '<span class="question-number">' + qnum + '.</span>'
            + '<span>' + q + '</span>'
            + '</div></div>';
        }
        listHtml += '</div></div>';

        sectionEl.innerHTML = headerHtml + listHtml;
        container.appendChild(sectionEl);
      }

      document.getElementById('questionCount').textContent = totalQuestions;
      document.getElementById('sectionCount').textContent = totalSections;

      if (totalQuestions === 0) {
        container.innerHTML = '<div class="no-results"><i class="fas fa-search"></i><p>未找到匹配的问题</p></div>';
      }
    }

    function toggleSection(header) {
      var section = header.parentElement;
      section.classList.toggle('expanded');
    }

    function openAiQa(question) {
      if (window.openAiQaWindow) {
        window.openAiQaWindow({ question: question });
      } else {
        alert('AI答疑功能需要在学习平台中使用\n\n问题：' + question);
      }
    }

    var searchInput = document.getElementById('searchInput');
    searchInput.oninput = function(e) {
      renderSections(e.target.value);
    };

    var backToTop = document.getElementById('backToTop');
    window.onscroll = function() {
      if (window.scrollY > 300) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    };
    backToTop.onclick = function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    renderSections('');
  </script>
</body>
</html>
